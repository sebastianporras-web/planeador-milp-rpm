name: Piloto de certificacion a cinco dias
on:
  push:
    branches: [piloto-certificacion-5d]
    paths:
      - 'experimento_19_empirico/piloto_certificacion_5d.py'
      - '.github/workflows/piloto-certificacion-5d.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: piloto-certificacion-5d
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - name: Probar generador y estados
        run: python -m pytest experimento_19_empirico/test_estudio.py -q
      - name: Regenerar las entradas originales
        run: python experimento_19_empirico/generar_instancias.py --salida entradas_100
      - name: Confirmar identidad del manifiesto previo
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('entradas_100/manifest.csv').read_bytes()
          b=Path('experimento_19_empirico/entradas_publicadas/manifest.csv').read_bytes()
          if hashlib.sha256(a).digest()!=hashlib.sha256(b).digest():
              raise SystemExit('Las entradas cambiaron. Piloto cancelado.')
          PY
      - name: Comprobar construcción y validez del refuerzo
        run: |
          for id in E029 E014 E097 E045; do
            python experimento_19_empirico/piloto_certificacion_5d.py \
              --entradas entradas_100 --salida "revision_modelo/$id" \
              --id "$id" --perfil reforzado --solo-modelo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: piloto5d-entradas-${{ github.run_id }}
          path: entradas_100/
          retention-days: 90
  resolver:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: [E029, E014, E097, E045]
        perfil: [base, reforzado]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: piloto5d-entradas-${{ github.run_id }}
          path: entradas_100
      - name: Registrar versión y recursos del trabajador
        run: |
          mkdir -p resultado
          python -m pip freeze > resultado/dependencias.txt
          lscpu > resultado/cpu.txt
          free -b > resultado/memoria.txt
      - name: Resolver sin inicio heredado con presupuesto de 900 s
        env:
          WLSACCESSID: ${{ secrets.WLSACCESSID }}
          WLSSECRET: ${{ secrets.WLSSECRET }}
          LICENSEID: ${{ secrets.LICENSEID }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python experimento_19_empirico/piloto_certificacion_5d.py \
            --entradas entradas_100 --salida resultado \
            --id '${{ matrix.id }}' --perfil '${{ matrix.perfil }}' --limite 900
      - name: Conservar resultado y registro nativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto5d-${{ matrix.id }}-${{ matrix.perfil }}-${{ github.run_id }}
          path: resultado/
          retention-days: 90
          if-no-files-found: error
  resumir:
    needs: [preparar, resolver]
    if: ${{ always() && needs.preparar.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: piloto5d-E*-*-${{ github.run_id }}
          path: bloques
      - name: Resumir sin reclasificar resultados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=sorted(Path('bloques').glob('*/resultado.json'))
          print('Resultados recibidos:',len(p),'de 8')
          for f in p:
              r=json.loads(f.read_text(encoding='utf-8'))
              print(r['id'],r['perfil'],'certificado=',r.get('certificado'),
                    'factible=',r.get('factible'),'GAP=',r.get('GAP_pct'),
                    'tiempo=',r.get('segundos_resolver'),'error=',r.get('error'))
          if len(p)!=8:
              raise SystemExit('Faltan resultados; no declarar piloto completo')
          PY
