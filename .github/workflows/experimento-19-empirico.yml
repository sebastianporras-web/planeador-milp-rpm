name: Estudio 100 instancias sinteticas de ventas
on:
  push:
    branches: [main]
    paths:
      - "experimento_19_empirico/**"
      - ".github/workflows/experimento-19-empirico.yml"
  workflow_dispatch:
    inputs:
      alcance:
        description: 'Verificar genera datos y prueba codigo; piloto resuelve una; completo resuelve las 100.'
        type: choice
        options: [verificar, piloto, completo]
        default: verificar
        required: true
env:
  ALCANCE: ${{ inputs.alcance || (contains(github.event.head_commit.message, '[estudio100 completo]') && 'completo') || 'verificar' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: estudio19-empirico100
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      bloques: ${{ steps.matriz.outputs.bloques }}
      alcance: ${{ steps.matriz.outputs.alcance }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - name: Pruebas de generador protocolo y clasificacion de estados
        run: python -m pytest experimento_19_empirico/test_estudio.py -q
      - name: Generar una vez las cien entradas y su trazabilidad
        run: python experimento_19_empirico/generar_instancias.py --salida entradas_100
      - name: Comprobar que las entradas coinciden con el registro previo
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          actual=Path('entradas_100/manifest.csv').read_bytes()
          registrado=Path('experimento_19_empirico/entradas_publicadas/manifest.csv').read_bytes()
          if hashlib.sha256(actual).digest()!=hashlib.sha256(registrado).digest():
              raise SystemExit('El conjunto difiere del manifiesto publicado. No se ejecutará.')
          PY
      - name: Publicar entradas antes de resolver
        uses: actions/upload-artifact@v4
        with:
          name: empirico100-entradas-${{ github.run_id }}
          path: entradas_100/
          retention-days: 90
      - name: Verificar licencia sin mostrar credenciales
        if: ${{ env.ALCANCE != 'verificar' }}
        env:
          WLSACCESSID: ${{ secrets.WLSACCESSID }}
          WLSSECRET: ${{ secrets.WLSSECRET }}
          LICENSEID: ${{ secrets.LICENSEID }}
        run: python experimento_19/validar_entorno.py
      - name: Preparar diez bloques
        id: matriz
        run: |
          python - <<'PY'
          import os,json
          b=[] if os.environ['ALCANCE']=='verificar' else [0] if os.environ['ALCANCE']=='piloto' else list(range(1,11))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('bloques='+json.dumps(b)+'\n')
              f.write('alcance='+os.environ['ALCANCE']+'\n')
          PY
  resolver:
    needs: preparar
    if: ${{ needs.preparar.outputs.alcance != 'verificar' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bloque: ${{ fromJSON(needs.preparar.outputs.bloques) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: empirico100-entradas-${{ github.run_id }}
          path: entradas_100
      - name: Registrar recursos y dependencias
        run: |
          mkdir -p resultados_100
          python -m pip freeze > resultados_100/dependencias.txt
          lscpu > resultados_100/cpu.txt
          free -b > resultados_100/memoria.txt
      - name: Resolver cuatro metodos sin inicios heredados
        env:
          BLOQUE: ${{ matrix.bloque }}
          WLSACCESSID: ${{ secrets.WLSACCESSID }}
          WLSSECRET: ${{ secrets.WLSSECRET }}
          LICENSEID: ${{ secrets.LICENSEID }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import os,sys,subprocess
          b=int(os.environ['BLOQUE'])
          ini,fin=(1,1) if b==0 else ((b-1)*10+1,b*10)
          subprocess.run([sys.executable,'experimento_19_empirico/ejecutar.py','lote',
              '--instancias','entradas_100','--salida','resultados_100',
              '--desde',str(ini),'--hasta',str(fin),'--limite','180',
              '--threads','2','--perfil','base'],check=True)
          PY
      - name: Conservar cada bloque incluso si un motor falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empirico100-bloque-${{ matrix.bloque }}-${{ github.run_id }}
          path: resultados_100/
          if-no-files-found: error
          retention-days: 90
  consolidar:
    needs: [preparar, resolver]
    if: ${{ always() && needs.preparar.result == 'success' && needs.preparar.outputs.alcance != 'verificar' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experimento_19/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: empirico100-entradas-${{ github.run_id }}
          path: entradas_100
      - uses: actions/download-artifact@v4
        with:
          pattern: empirico100-bloque-*
          path: bloques_100
      - name: Construir cuadros perfiles y control de cobertura
        run: python experimento_19_empirico/reportar.py --instancias entradas_100 --resultados bloques_100 --salida informe_100
      - name: Verificar que completo significa cuatrocientos registros sin errores
        env:
          ALCANCE: ${{ needs.preparar.outputs.alcance }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads(Path('informe_100/estado_informe.json').read_text(encoding='utf-8'))
          if os.environ['ALCANCE']=='completo' and not d['sin_errores_y_completo']:
              raise SystemExit('El informe conserva errores o ausentes; no declarar cerrado.')
          PY
      - name: Publicar informe incluso cuando no este completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empirico100-informe-${{ github.run_id }}
          path: informe_100/
          if-no-files-found: error
          retention-days: 90
