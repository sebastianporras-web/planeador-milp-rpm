name: Estudio 144 instancias - correccion 19 (presupuesto 180 s)
on:
  workflow_dispatch:
    inputs:
      alcance:
        description: 'Ejecutar primero piloto; completo ejecuta 144 instancias'
        type: choice
        options: [piloto, completo]
        default: piloto
        required: true
permissions:
  contents: read
concurrency:
  group: experimento-19
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      bloques: ${{ steps.matriz.outputs.bloques }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - name: Comprobar codigo
        run: python -m pytest tests/test_generador_issue19.py tests/test_ejecutor_issue19.py -q
      - name: Comprobar licencia sin mostrar credenciales
        env:
          WLSACCESSID: ${{ secrets.WLSACCESSID }}
          WLSSECRET: ${{ secrets.WLSSECRET }}
          LICENSEID: ${{ secrets.LICENSEID }}
        run: python experimento_19/validar_entorno.py
      - name: Preparar bloques
        id: matriz
        env:
          ALCANCE: ${{ inputs.alcance }}
        run: |
          python - <<'PY'
          import os,json
          # Doce bloques seriales de 12 instancias: reduce la sobrecarga de
          # aprovisionamiento sin alterar las 144 entradas ni los cuatro métodos.
          bloques=[0] if os.environ['ALCANCE']=='piloto' else list(range(1,13))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('bloques='+json.dumps(bloques)+'\n')
          PY
  resolver:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bloque: ${{ fromJSON(needs.preparar.outputs.bloques) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experimento_19/requirements.txt
      - run: python -m pip install -r experimento_19/requirements.txt
      - name: Generar conjunto fijo
        run: python experimento_19/generar_instancias.py --factorial-exploratorio --salida instancias_19
      - name: Registrar entorno
        run: |
          mkdir -p resultados_19
          python -m pip freeze > resultados_19/dependencias.txt
          lscpu > resultados_19/cpu.txt
          free -b > resultados_19/memoria.txt
      - name: Resolver cuatro metodos
        env:
          BLOQUE: ${{ matrix.bloque }}
          WLSACCESSID: ${{ secrets.WLSACCESSID }}
          WLSSECRET: ${{ secrets.WLSSECRET }}
          LICENSEID: ${{ secrets.LICENSEID }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import os,subprocess,sys
          b=int(os.environ['BLOQUE'])
          inicio,fin=(1,1) if b==0 else ((b-1)*12+1,min(b*12,144))
          subprocess.run([sys.executable,'experimento_19/ejecutar.py','lote',
            '--instancias','instancias_19','--salida','resultados_19',
            '--desde',str(inicio),'--hasta',str(fin),'--limite','180',
            '--threads','2','--perfil','agresivo'],check=True)
          PY
      - name: Guardar evidencia del bloque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estudio19-bloque-${{ matrix.bloque }}-${{ github.run_id }}
          path: |
            resultados_19/
            instancias_19/
          if-no-files-found: warn
          retention-days: 90
  consolidar:
    needs: [preparar, resolver]
    if: ${{ always() && needs.preparar.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experimento_19/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: estudio19-bloque-*
          path: bloques_19
      - run: python experimento_19/generar_instancias.py --factorial-exploratorio --salida instancias_19
      - name: Consolidar resultados sin ocultar ausentes
        run: python experimento_19/reportar.py --instancias instancias_19 --resultados bloques_19 --salida informe_19
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-estudio19-${{ github.run_id }}
          path: informe_19/
